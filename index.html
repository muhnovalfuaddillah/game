<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Blaze Game</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .score-board {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .score-box {
      background: #1e293b;
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: center;
      min-width: 100px;
    }

    .score-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .score-value {
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
    }

    /* Board Grid */
    #board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 4px;
      background: #1e293b;
      padding: 8px;
      border-radius: 16px;
      border: 2px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 360px;
      height: 360px;
    }

    .cell {
      background: #0f172a;
      border-radius: 6px;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .cell.filled {
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .cell.hover-valid {
      background: #38bdf888 !important;
      transform: scale(0.96);
    }

    .cell.clearing {
      animation: pop 0.3s ease-out forwards;
    }

    @keyframes pop {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); background-color: #f43f5e; }
      100% { transform: scale(0); opacity: 0; }
    }

    /* Pieces Tray */
    #pieces-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      max-width: 360px;
      margin-top: 24px;
      height: 110px;
      background: #1e293b;
      border-radius: 16px;
      padding: 10px;
      border: 1px solid #334155;
    }

    .piece-holder {
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }

    .piece-holder:active {
      cursor: grabbing;
    }

    .piece-grid {
      display: grid;
      gap: 2px;
    }

    .piece-cell {
      width: 18px;
      height: 18px;
      border-radius: 4px;
    }

    /* Modal Game Over */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #1e293b;
      padding: 28px;
      border-radius: 20px;
      text-align: center;
      border: 1px solid #334155;
      max-width: 300px;
      width: 90%;
    }

    .btn-restart {
      margin-top: 18px;
      padding: 10px 24px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border: none;
      color: white;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      transition: opacity 0.2s;
    }

    .btn-restart:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">BLOCK BLAZE</div>
    <div class="score-board">
      <div class="score-box">
        <div class="score-label">Skor</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Tertinggi</div>
        <div class="score-value" id="high-score">0</div>
      </div>
    </div>
  </div>

  <div id="board"></div>

  <div id="pieces-container"></div>

  <!-- Modal Game Over -->
  <div class="modal" id="game-over-modal">
    <div class="modal-content">
      <h2 style="color: #f43f5e; margin-bottom: 8px;">Game Over!</h2>
      <p style="color: #94a3b8; font-size: 14px;">Tidak ada langkah tersisa.</p>
      <div style="margin: 16px 0;">
        <span style="color: #94a3b8; font-size: 12px;">Skor Akhir:</span>
        <div style="font-size: 28px; font-weight: 800; color: #38bdf8;" id="final-score">0</div>
      </div>
      <button class="btn-restart" onclick="resetGame()">Main Lagi</button>
    </div>
  </div>

  <script>
    const BOARD_SIZE = 8;
    const boardElement = document.getElementById('board');
    const piecesContainer = document.getElementById('pieces-container');
    const scoreElement = document.getElementById('score');
    const highScoreElement = document.getElementById('high-score');
    const modal = document.getElementById('game-over-modal');

    let boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
    let score = 0;
    let highScore = localStorage.getItem('block_blaze_high') || 0;
    highScoreElement.textContent = highScore;

    let currentPieces = [null, null, null];
    let selectedPieceIndex = null;

    // Warna balok (Vibrant Colors)
    const COLORS = ['#38bdf8', '#fbbf24', '#f43f5e', '#a855f7', '#34d399', '#fb923c'];

    // Variasi Bentuk Balok (Shape Matrix)
    const SHAPES = [
      [[1]], // 1x1
      [[1, 1]], // 1x2
      [[1], [1]], // 2x1
      [[1, 1, 1]], // 1x3
      [[1], [1], [1]], // 3x1
      [[1, 1], [1, 1]], // 2x2 Square
      [[1, 1, 1], [1, 1, 1], [1, 1, 1]], // 3x3 Square
      [[1, 1, 1], [0, 1, 0]], // T-Shape
      [[1, 0], [1, 0], [1, 1]], // L-Shape
      [[1, 1, 1, 1]], // 1x4 Line
    ];

    function initBoard() {
      boardElement.innerHTML = '';
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.dataset.row = r;
          cell.dataset.col = c;
          
          cell.addEventListener('mouseenter', () => handleHover(r, c));
          cell.addEventListener('mouseleave', clearHover);
          cell.addEventListener('click', () => handlePlaceBlock(r, c));
          
          boardElement.appendChild(cell);
        }
      }
    }

    function renderBoard() {
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = boardElement.children[r * BOARD_SIZE + c];
          const color = boardState[r][c];
          if (color) {
            cell.style.backgroundColor = color;
            cell.classList.add('filled');
          } else {
            cell.style.backgroundColor = '#0f172a';
            cell.classList.remove('filled');
          }
        }
      }
    }

    function generatePieces() {
      piecesContainer.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const randomShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        const randomColor = COLORS[Math.floor(Math.random() * COLORS.length)];
        currentPieces[i] = { shape: randomShape, color: randomColor };
        renderPieceHolder(i);
      }
      checkGameOver();
    }

    function renderPieceHolder(index) {
      const pieceData = currentPieces[index];
      const holder = document.createElement('div');
      holder.classList.add('piece-holder');
      
      if (!pieceData) return;

      const grid = document.createElement('div');
      grid.classList.add('piece-grid');
      grid.style.gridTemplateColumns = `repeat(${pieceData.shape[0].length}, 1fr)`;

      pieceData.shape.forEach(row => {
        row.forEach(val => {
          const pCell = document.createElement('div');
          pCell.classList.add('piece-cell');
          if (val === 1) {
            pCell.style.backgroundColor = pieceData.color;
          } else {
            pCell.style.opacity = '0';
          }
          grid.appendChild(pCell);
        });
      });

      holder.appendChild(grid);
      holder.addEventListener('click', () => selectPiece(index, holder));
      piecesContainer.appendChild(holder);
    }

    function selectPiece(index, holderElement) {
      if (!currentPieces[index]) return;
      
      document.querySelectorAll('.piece-holder').forEach(h => h.style.border = 'none');
      if (selectedPieceIndex === index) {
        selectedPieceIndex = null;
      } else {
        selectedPieceIndex = index;
        holderElement.style.border = '2px dashed #38bdf8';
        holderElement.style.borderRadius = '10px';
      }
      clearHover();
    }

    function canPlace(shape, startR, startC) {
      const rows = shape.length;
      const cols = shape[0].length;

      if (startR + rows > BOARD_SIZE || startC + cols > BOARD_SIZE) return false;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (shape[r][c] === 1 && boardState[startR + r][startC + c] !== null) {
            return false;
          }
        }
      }
      return true;
    }

    function handleHover(r, c) {
      if (selectedPieceIndex === null) return;
      const piece = currentPieces[selectedPieceIndex];
      if (!piece) return;

      clearHover();

      if (canPlace(piece.shape, r, c)) {
        for (let pr = 0; pr < piece.shape.length; pr++) {
          for (let pc = 0; pc < piece.shape[0].length; pc++) {
            if (piece.shape[pr][pc] === 1) {
              const cellIndex = (r + pr) * BOARD_SIZE + (c + pc);
              boardElement.children[cellIndex].classList.add('hover-valid');
            }
          }
        }
      }
    }

    function clearHover() {
      Array.from(boardElement.children).forEach(cell => cell.classList.remove('hover-valid'));
    }

    function handlePlaceBlock(r, c) {
      if (selectedPieceIndex === null) return;
      const piece = currentPieces[selectedPieceIndex];
      if (!piece || !canPlace(piece.shape, r, c)) return;

      // Place Block on Board
      let blocksCount = 0;
      for (let pr = 0; pr < piece.shape.length; pr++) {
        for (let pc = 0; pc < piece.shape[0].length; pc++) {
          if (piece.shape[pr][pc] === 1) {
            boardState[r + pr][c + pc] = piece.color;
            blocksCount++;
          }
        }
      }

      addScore(blocksCount * 10);
      currentPieces[selectedPieceIndex] = null;
      selectedPieceIndex = null;
      
      renderBoard();
      clearLines();
      
      // Update Tray
      piecesContainer.children[selectedPieceIndex]?.remove();
      refreshPiecesIfNeeded();
    }

    function clearLines() {
      let rowsToClear = [];
      let colsToClear = [];

      // Check rows
      for (let r = 0; r < BOARD_SIZE; r++) {
        if (boardState[r].every(cell => cell !== null)) {
          rowsToClear.push(r);
        }
      }

      // Check cols
      for (let c = 0; c < BOARD_SIZE; c++) {
        let full = true;
        for (let r = 0; r < BOARD_SIZE; r++) {
          if (boardState[r][c] === null) { full = false; break; }
        }
        if (full) colsToClear.push(c);
      }

      let totalCleared = rowsToClear.length + colsToClear.length;
      if (totalCleared > 0) {
        // Animation
        rowsToClear.forEach(r => {
          for (let c = 0; c < BOARD_SIZE; c++) {
            boardElement.children[r * BOARD_SIZE + c].classList.add('clearing');
          }
        });
        colsToClear.forEach(c => {
          for (let r = 0; r < BOARD_SIZE; r++) {
            boardElement.children[r * BOARD_SIZE + c].classList.add('clearing');
          }
        });

        setTimeout(() => {
          rowsToClear.forEach(r => {
            for (let c = 0; c < BOARD_SIZE; c++) boardState[r][c] = null;
          });
          colsToClear.forEach(c => {
            for (let r = 0; r < BOARD_SIZE; r++) boardState[r][c] = null;
          });

          addScore(totalCleared * 100);
          renderBoard();
          checkGameOver();
        }, 300);
      } else {
        checkGameOver();
      }
    }

    function refreshPiecesIfNeeded() {
      if (currentPieces.every(p => p === null)) {
        generatePieces();
      } else {
        piecesContainer.innerHTML = '';
        currentPieces.forEach((p, idx) => renderPieceHolder(idx));
      }
    }

    function addScore(val) {
      score += val;
      scoreElement.textContent = score;
      if (score > highScore) {
        highScore = score;
        highScoreElement.textContent = highScore;
        localStorage.setItem('block_blaze_high', highScore);
      }
    }

    function checkGameOver() {
      let activePieces = currentPieces.filter(p => p !== null);
      if (activePieces.length === 0) return;

      let hasValidMove = false;
      for (let p of activePieces) {
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (canPlace(p.shape, r, c)) {
              hasValidMove = true;
              break;
            }
          }
          if (hasValidMove) break;
        }
        if (hasValidMove) break;
      }

      if (!hasValidMove) {
        document.getElementById('final-score').textContent = score;
        modal.classList.add('active');
      }
    }

    function resetGame() {
      boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
      score = 0;
      scoreElement.textContent = 0;
      modal.classList.remove('active');
      initBoard();
      generatePieces();
    }

    // Start Game
    initBoard();
    generatePieces();
  </script>
</body>
</html>
